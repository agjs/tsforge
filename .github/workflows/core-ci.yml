name: CI

on:
  push:
    branches: [main]
    paths:
      - "packages/**"
      - "bun.lock"
      - "eslint.config.js"
      - "package.json"
      - "tsconfig.json"
      - ".github/workflows/core-ci.yml"
  pull_request:
    branches: [main]

concurrency:
  group: core-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: typecheck + lint + test
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Detect relevant changes
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: filter
        with:
          filters: |
            code:
              - 'packages/**'
              - 'bun.lock'
              - 'eslint.config.js'
              - 'package.json'
              - 'tsconfig.json'
              - '.github/workflows/core-ci.yml'

      - name: No-op notice for unaffected PRs
        if: steps.filter.outputs.code != 'true'
        run: echo "No core files changed in this PR — skipped."

      - name: Set up Bun
        if: steps.filter.outputs.code == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Cache bun install
        if: steps.filter.outputs.code == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        if: steps.filter.outputs.code == 'true'
        run: bun install --frozen-lockfile

      - name: Install ripgrep
        if: steps.filter.outputs.code == 'true'
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Verify install.sh copies match
        if: steps.filter.outputs.code == 'true'
        run: diff scripts/install.sh apps/docs/public/install.sh

      - name: Rules catalog drift check
        if: steps.filter.outputs.code == 'true'
        run: |
          bun run rules:build
          git diff --exit-code packages/core/RULES.md

      - name: Architecture map drift check
        if: steps.filter.outputs.code == 'true'
        run: |
          bun run arch:build
          git diff --exit-code packages/core/ARCHITECTURE.md

      - name: Validate
        if: steps.filter.outputs.code == 'true'
        run: bun run validate
