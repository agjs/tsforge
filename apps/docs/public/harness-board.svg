<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 680" role="img" aria-label="tsforge harness board">
  <defs><style type="text/css"><![CDATA[
    .tf-board-harness-bg { stroke: rgba(96,165,250,0.55); fill: none; }
    .tf-board-boundary-label { font-family: Inter, ui-sans-serif, sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 0.22em; fill: #93c5fd; }
    .tf-board-trace-stop-a { stop-color: #3b82f6; }
    .tf-board-trace-stop-b { stop-color: #38bdf8; }
    .tf-board-node-bg { fill: rgba(18,20,28,0.92); stroke: rgba(96,165,250,0.38); stroke-width: 1.2; }
    .tf-board-node-title { font-family: Inter, ui-sans-serif, sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 0.1em; fill: #e8ecf5; }
    .tf-board-node-sub { font-family: ui-monospace, Menlo, monospace; font-size: 7.5px; fill: #94a3b8; }
    .tf-board-icon-stroke { stroke: #93c5fd; fill: none; }
    .tf-board-icon-fill { fill: rgba(59,130,246,0.35); stroke: none; }
    .tf-board-gate-check { stroke: #4ade80; fill: none; }
    .tf-board-model-panel { fill: rgba(13,16,24,0.94); stroke: rgba(56,189,248,0.55); stroke-width: 1.4; }
    .tf-board-heatsink { fill: rgba(56,189,248,0.22); stroke: rgba(56,189,248,0.65); }
    .tf-board-heatsink-fin, .tf-board-pin { stroke: rgba(56,189,248,0.55); stroke-width: 1; fill: none; }
    .tf-board-model-chip { fill: rgba(56,189,248,0.28); stroke: #38bdf8; stroke-width: 1.4; }
    .tf-board-model-title { font-family: Inter, ui-sans-serif, sans-serif; font-size: 13px; font-weight: 700; letter-spacing: 0.12em; fill: #e8ecf5; }
    .tf-board-model-sub { font-family: ui-monospace, Menlo, monospace; font-size: 8.5px; fill: #94a3b8; }
    .tf-board-traces { stroke: url(#tf-board-trace); }
  ]]></style></defs>
   <defs> <linearGradient id="tf-board-trace" x1="0%" y1="0%" x2="100%" y2="100%"> <stop offset="0%" class="tf-board-trace-stop-a"></stop> <stop offset="100%" class="tf-board-trace-stop-b"></stop> </linearGradient> <filter id="tf-board-glow" x="-20%" y="-20%" width="140%" height="140%"> <feDropShadow dx="0" dy="0" stdDeviation="3" class="tf-board-glow-shadow"></feDropShadow> </filter> </defs> <!-- Outer HARNESS boundary --> <rect x="36" y="44" width="748" height="592" rx="18" class="tf-board-harness-bg" fill="none" stroke-width="1.5" stroke-dasharray="7 5"></rect> <text x="410" y="72" text-anchor="middle" class="tf-board-boundary-label">HARNESS</text> <!-- Circuit traces --> <g class="tf-board-traces" stroke="url(#tf-board-trace)" stroke-width="1.6" fill="none"> <path d="M410 168 L410 300"></path> <path d="M215 268 L330 330"></path> <path d="M215 488 L330 400"></path> <path d="M605 268 L490 330"></path> <path d="M605 488 L490 400"></path> </g> <!-- STACK (top) --> <g class="tf-board-node" transform="translate(410, 130)"> <g transform="translate(-52, -44)"> <rect width="104" height="88" rx="10" class="tf-board-node-bg"></rect> <g transform="translate(22, 12)" stroke-width="1.4" fill="none" class="tf-board-icon-stroke"> <rect x="0" y="0" width="14" height="36" rx="2"></rect> <rect x="20" y="4" width="14" height="32" rx="2"></rect> <rect x="40" y="8" width="14" height="28" rx="2"></rect> <line x1="2" y1="8" x2="12" y2="8"></line> <line x1="22" y1="12" x2="32" y2="12"></line> <line x1="42" y1="16" x2="52" y2="16"></line> </g> <text x="52" y="62" text-anchor="middle" class="tf-board-node-title">STACK</text>  </g> </g> <!-- LOOP (left-top) --> <g class="tf-board-node" transform="translate(160, 268)"> <g transform="translate(-58, -48)"> <rect width="116" height="96" rx="10" class="tf-board-node-bg"></rect> <g transform="translate(28, 10)" stroke-width="1.4" fill="none" class="tf-board-icon-stroke"> <rect x="0" y="14" width="28" height="16" rx="3"></rect> <circle cx="14" cy="22" r="5"></circle> <path d="M44 8 A18 18 0 1 1 44 36"></path> <polyline points="44,36 52,36 52,28" stroke-linejoin="round"></polyline> </g> <text x="58" y="64" text-anchor="middle" class="tf-board-node-title">LOOP</text>  </g> </g> <!-- GATE (left-bottom) --> <g class="tf-board-node" transform="translate(160, 488)"> <g transform="translate(-58, -48)"> <rect width="116" height="96" rx="10" class="tf-board-node-bg"></rect> <g transform="translate(24, 8)" stroke-width="1.4" fill="none"> <circle cx="30" cy="24" r="22" class="tf-board-icon-stroke"></circle> <path d="M30 24 L30 12" class="tf-board-icon-stroke"></path> <path d="M30 24 L42 30" class="tf-board-icon-stroke"></path> <polyline points="18,38 26,46 44,28" class="tf-board-gate-check" stroke-width="2" fill="none" stroke-linejoin="round"></polyline> </g> <text x="58" y="64" text-anchor="middle" class="tf-board-node-title">GATE</text>  </g> </g> <!-- TOOLS (right-top) --> <g class="tf-board-node" transform="translate(660, 268)"> <g transform="translate(-58, -48)"> <rect width="116" height="96" rx="10" class="tf-board-node-bg"></rect> <g transform="translate(22, 10)" stroke-width="1.4" fill="none" class="tf-board-icon-stroke"> <rect x="0" y="0" width="52" height="34" rx="4"></rect> <polyline points="6,28 14,20 22,24 30,14 38,18 46,10"></polyline> <rect x="58" y="8" width="8" height="18" rx="1"></rect> <rect x="58" y="8" width="8" height="6" rx="1" class="tf-board-icon-fill"></rect> </g> <text x="58" y="64" text-anchor="middle" class="tf-board-node-title">TOOLS</text>  </g> </g> <!-- SESSION (right-bottom) --> <g class="tf-board-node" transform="translate(660, 488)"> <g transform="translate(-58, -48)"> <rect width="116" height="96" rx="10" class="tf-board-node-bg"></rect> <g transform="translate(20, 14)" stroke-width="1.4" fill="none" class="tf-board-icon-stroke"> <rect x="0" y="0" width="56" height="28" rx="4"></rect> <rect x="8" y="6" width="40" height="4" rx="1" class="tf-board-icon-fill"></rect> <rect x="8" y="14" width="28" height="4" rx="1" class="tf-board-icon-fill"></rect> <rect x="8" y="22" width="20" height="4" rx="1" class="tf-board-icon-fill"></rect> <circle cx="52" cy="22" r="3"></circle> </g> <text x="58" y="64" text-anchor="middle" class="tf-board-node-title">SESSION</text>  </g> </g> <!-- MODEL (center) --> <g class="tf-board-node tf-board-node--model" transform="translate(410, 360)" filter="url(#tf-board-glow)"> <g transform="translate(-70, -62)"> <rect width="140" height="124" rx="12" class="tf-board-model-panel"></rect> <g transform="translate(30, 8)"> <rect x="16" y="0" width="48" height="14" rx="3" class="tf-board-heatsink"></rect> <line x1="22" y1="0" x2="22" y2="14" class="tf-board-heatsink-fin"></line> <line x1="32" y1="0" x2="32" y2="14" class="tf-board-heatsink-fin"></line> <line x1="42" y1="0" x2="42" y2="14" class="tf-board-heatsink-fin"></line> <line x1="52" y1="0" x2="52" y2="14" class="tf-board-heatsink-fin"></line> <rect x="8" y="18" width="64" height="44" rx="4" class="tf-board-model-chip"></rect> <line x1="0" y1="28" x2="8" y2="28" class="tf-board-pin"></line> <line x1="0" y1="38" x2="8" y2="38" class="tf-board-pin"></line> <line x1="0" y1="48" x2="8" y2="48" class="tf-board-pin"></line> <line x1="72" y1="28" x2="80" y2="28" class="tf-board-pin"></line> <line x1="72" y1="38" x2="80" y2="38" class="tf-board-pin"></line> <line x1="72" y1="48" x2="80" y2="48" class="tf-board-pin"></line> </g> <text x="70" y="88" text-anchor="middle" class="tf-board-model-title">MODEL</text>  </g> </g> 
</svg>
